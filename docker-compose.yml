services:
  postgres:
    image: postgres:15.5
    cap_drop:
      - NET_RAW
    hostname: postgresql
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    cap_drop:
      - NET_RAW
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agentic
      DB_USER: agentic
      DB_PASSWORD: agentic
      DB_DRIVER: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: http://localhost:4200
      AGENT_MODE: fixture
      REDIS_ENABLED: "true"
      SHORTENER_BASE_URL: http://localhost:8080
      ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8080:8080"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend