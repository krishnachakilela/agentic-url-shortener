spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379

app:
  redis:
    enabled: false
  cors:
    allowed-origins: http://localhost:4200
  shortener:
    base-url: http://localhost:8080
    code-length: 7
    max-url-length: 2048
    rate-limit-per-minute: 1000
  orchestration:
    agent-mode: fixture
    max-retries: 1
    stage-timeout-seconds: 30
    artifacts-dir: ${java.io.tmpdir}/agentic-artifacts-test
