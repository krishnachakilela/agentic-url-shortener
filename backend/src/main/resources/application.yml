server:
  port: 8080

spring:
  application:
    name: agentic-url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic}
    username: ${DB_USER:agentic}
    password: ${DB_PASSWORD:agentic}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  redis:
    enabled: ${REDIS_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  shortener:
    base-url: ${SHORTENER_BASE_URL:http://localhost:8080}
    code-length: 7
    max-url-length: 2048
    rate-limit-per-minute: 60
  orchestration:
    agent-mode: ${AGENT_MODE:fixture}
    max-retries: 2
    stage-timeout-seconds: 120
    artifacts-dir: ${ARTIFACTS_DIR:./artifacts}
    # Fail testing while attempt < this value (0 = disabled). Demo retry loops with e.g. 2.
    testing-fail-until-attempt: ${TESTING_FAIL_UNTIL_ATTEMPT:0}
    require-local-admin: ${REQUIRE_LOCAL_ADMIN:false}

logging:
  level:
    com.schwab.agentic: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
